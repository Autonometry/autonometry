  observe_passively: evdev tap on keyboard; or log lines 'Left arrow key pressed...'
  how_it_could_be_faked: —
  source_url:
  - https://github.com/huggingface/lerobot/blob/7e241bd630a3719a56157a497ce5d08f244784f1/src/lerobot/utils/keyboard_input.py#L421
  - https://github.com/huggingface/lerobot/blob/7e241bd630a3719a56157a497ce5d08f244784f1/src/lerobot/utils/keyboard_input.py#L164
  - https://github.com/huggingface/lerobot/blob/7e241bd630a3719a56157a497ce5d08f244784f1/src/lerobot/utils/keyboard_input.py#L168
  version: lerobot v0.6.1 (7e241bd630a3)
  tag: VERIFIED
  taxonomy:
    asserted: n/a
    cleared: n/a
    reason: n/a
    actor_id: n/a
    scope: n/a
    event: 'right arrow: task_end(outcome=unknown); left arrow: task_end(outcome=aborted); Esc: session_end'
    flags:
    - discarded episodes leave no dataset trace
- id: S15
  name: '''Intervention rate'' / ''Episode intervention'' InteractionMessage'
  source: HIL-SERL actor -> learner (gRPC SendInteractions) and W&B logging
  message_type: float, int per episode
  rate: per episode
  meaning:
    value: fraction of steps human_local within the episode
  reliability: aggregate only
  observe_passively: pcap of SendInteractions; W&B dashboard
  how_it_could_be_faked: not persisted locally by default
  source_url:
  - https://github.com/huggingface/lerobot/blob/7e241bd630a3719a56157a497ce5d08f244784f1/src/lerobot/rl/actor.py#L411
  version: lerobot v0.6.1 (7e241bd630a3)
  tag: VERIFIED
  taxonomy:
    asserted: n/a (aggregate)
    cleared: n/a
    reason: n/a
    actor_id: n/a
    scope: whole_robot
    event: note on task_end
    flags: []
- id: S16
  name: Dataset naming and robot_type metadata
  source: 'meta/info.json robot_type (''so_follower'' for both SO-100 and SO-101); repo_id prefixes: ''rollout_'' enforced
    by lerobot-rollout, ''eval_'' rejected by lerobot-record'
  message_type: strings
  rate: per dataset
  meaning:
    rollout_ prefix: weak hint of policy run
    no intervention column: mode unknown
  reliability: low; lerobot-record does not forbid 'rollout_' names
  observe_passively: read meta/info.json
  how_it_could_be_faked: rename
  source_url:
  - https://github.com/huggingface/lerobot/blob/7e241bd630a3719a56157a497ce5d08f244784f1/src/lerobot/rollout/context.py#L431
  - https://github.com/huggingface/lerobot/blob/7e241bd630a3719a56157a497ce5d08f244784f1/src/lerobot/scripts/lerobot_record.py#L435
  - https://github.com/huggingface/lerobot/blob/7e241bd630a3719a56157a497ce5d08f244784f1/src/lerobot/robots/so_follower/so_follower.py#L44
  version: lerobot v0.6.1 (7e241bd630a3)
  tag: VERIFIED
  taxonomy:
