- id: S17
  name: Follower Present_Load / Present_Current with constant or absent Goal_Position
  source: follower servos registers 60 and 69
  message_type: 2 bytes per servo
  rate: pollable (not polled by LeRobot by default)
  meaning:
    load_without_command_change: human_local physical guidance (kinesthetic)
  reliability: unknown sensitivity
  observe_passively: UART tap only sees them if some process reads them; otherwise unobservable passively
  how_it_could_be_faked: —
  source_url:
