- id: S18
  name: Replay (lerobot-replay) command stream
  source: scripts/lerobot_replay.py re-sends the stored action column at dataset fps through send_action
  message_type: serial sync-writes identical to S6
  rate: dataset fps
  meaning:
    stream: neither ai nor human at run time (recorded human or ai actions replayed) - must be classified as 'replay'
  reliability: indistinguishable from ai on the follower bus; distinguishable by absence of inference process and non-reactivity
  observe_passively: compare follower-bus commands against known dataset action columns; check for a policy process
  how_it_could_be_faked: this IS the faking technique
  source_url:
