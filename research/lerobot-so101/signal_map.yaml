taxonomy:
  definitions: definitions.md (artifact 2168860d-f130-48a2-a36a-2e52c2e5c3a7)
  schema: event.schema.json (artifact efd8879d-429a-495f-81c9-4d3404f57a9b)
  states:
  - ai
  - human_local
  - human_remote
  - shared
  - safety_stop
  - idle
  - unknown
  reasons:
  - ai_requested_help
  - human_initiated
  - safety
  - planned
  default_scope: whole_robot
  note: meaning_vocabulary below is the pre-taxonomy label; 'taxonomy' per signal is the normative mapping
defaults_affecting_observability:
  push_to_hub: 'True'
  private: None (Hub default)
  strategy.type: base (no recording)
  dagger.record_autonomous: 'False'
  display_data: 'False'
  display_mode: rerun
  init_logging.log_file: None
  init_logging.console_level: INFO
  max_relative_target: None (no clipping)
  disable_torque_on_disconnect: 'True'
  policy_server.port: 8080 (insecure gRPC)
  foxglove: 127.0.0.1:8765
clocks:
  dataset.timestamp: synthetic frame_index/fps, float32, 1/fps, no sync
  repo_id_suffix: local wall clock %Y%m%d_%H%M%S
  log_lines: local wall clock 1 s
  foxglove.log_time: time.time_ns() wall
  async_inference.TimedData.timestamp: time.time() wall, client and server unsynchronised
  control_loops: time.perf_counter() monotonic, not persisted
  observer_rule: observer stamps RFC 3339 UTC ts itself
uncovered_cases:
- replay (lerobot-replay)
- hold with no controller inside a task (DAgger PAUSED, HIL-SERL record between interventions, torch warm-up)
- multi-step hand-over ai->shared->human_local must count once
- local vs remote undeterminable from software
- per-joint firmware safety cut-outs in a single-scope robot
- unrecorded human time by design -> unknown share unbounded in dataset-only reports
- no help_request/approval/hint pathway exists
