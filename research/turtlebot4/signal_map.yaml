    event_type: transition
    actor_id: human:<operator_id>
  - condition: buttons[1] (B) short press -> function EStop toggles Create 3 e_stop
    state: safety_stop
    reason: safety
    scope: base
    event_type: transition
    actor_id: null
  - condition: buttons[6] (L2) / buttons[7] (R2) -> Wall Follow Left/Right (Create 3 firmware autonomous behaviour, 10 s)
    state: human_local
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:<operator_id>
  - condition: buttons[10] (Home) held 3000 ms -> Undock; short -> Dock
    state: human_local
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:<operator_id>
  uncovered_cases:
  - 'Wall Follow is a firmware behaviour triggered by a human button: it reacts to sensing (bump/IR) so it is `ai` by Section
    2, but the trigger is human and the duration fixed (10 s): propose `shared` reason human_initiated for its runtime, or
    new sub-tag x_firmware_behavior.'
  - 'EStop toggle via controller B: the taxonomy maps e-stop to `safety_stop` with reason `safety`; here the human presses
    it deliberately but not necessarily for safety (e.g. to pause) -> 6.8 hold caused by human = `shared`/human_initiated;
    conflict with "transitions into safety_stop always carry safety". Propose: use safety_stop/safety and add x_trigger=human_button.'
  - 'Bluetooth link is between controller and the Pi: a Wi-Fi-only observer sees /joy only if the Pi relays it over DDS (it
    does, via joy_linux_node); if the Pi is on a discovery server the observer does not join, the path is invisible.'
  reliability: /joy stops when the controller sleeps; no heartbeat; joy_linux publishes only on change/autorepeat, so absence
    of messages is ambiguous (idle controller vs disconnected).
  observe_passively: Subscribe to /joy; derive enable-button held intervals; cross-check with /cmd_vel publisher teleop_twist_joy_node;
    record /function_calls for button-mapped functions.
  how_it_could_be_faked: Publish fake /joy from any machine (teleop_twist_joy and turtlebot4_node will act on it, so the fake
    also moves the robot); unplug/rename joy device; run teleop_twist_joy with a different config publishing to /cmd_vel without
    an enable button (require_enable_button:=false).
  tag: VERIFIED
  source_url:
