    /smooth_path/_action/status; /is_path_valid (nav2_msgs/srv/IsPathValid); /plan (nav_msgs/Path)
  message_type: nav2_msgs/action/FollowPath (error codes 100-107), ComputePathToPose (200-208); action_msgs/msg/GoalStatusArray
  rate_hz: 'FollowPath: 20 Hz control loop (controller_frequency nav2.yaml:23); ComputePathToPose: 1 Hz replanning (RateController
    hz=1.0 in the default XML)'
  qos: KeepLast(1), RELIABLE, TRANSIENT_LOCAL (status)
  mapping:
  - condition: /follow_path EXECUTING
    state: ai
    reason: null
    scope: base
    event_type: transition
    actor_id: ai:nav2_bt_navigator
  - condition: '/follow_path ABORTED with FAILED_TO_MAKE_PROGRESS=105 (SimpleProgressChecker: 0.5 m in 10 s, nav2.yaml:34-35)
      or NO_VALID_CONTROL=106'
    state: ai
    reason: null
    scope: base
    event_type: null
    actor_id: ai:nav2_bt_navigator
    note: none (x_error_code; recovery follows)
  - condition: /compute_path_to_pose ABORTED NO_VALID_PATH=208
    state: ai
    reason: null
    scope: base
    event_type: null
    actor_id: ai:nav2_bt_navigator
    note: none (x_error_code)
  uncovered_cases:
  - 'BasicNavigator.followPath() lets a human/script send a hand-drawn path to /follow_path without bt_navigator: the controller
    then tracks a human-authored path. Proposed: shared (human sets the path, AI executes) if the path came from a declared
    human device; ai if from a planner.'
  reliability: Transient-local status; /follow_path EXECUTING is the most direct 'AI is driving' signal on TB4.
  observe_passively: Subscribe to status topics.
  how_it_could_be_faked: As N1.
  tag: VERIFIED
  source_url:
  - https://github.com/ros-navigation/navigation2/blob/d5d768b7b38a05e7cfd2b6c693b786b402161bed/nav2_controller/src/controller_server.cpp#L240-L247
  - https://github.com/ros-navigation/navigation2/blob/d5d768b7b38a05e7cfd2b6c693b786b402161bed/nav2_controller/src/controller_server.cpp#L502-L551
