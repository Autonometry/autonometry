- id: T16
  name: E-stop and power services (TB4 layer clients)
  layer: turtlebot4_node -> create3_republisher -> Create 3
  source: turtlebot4_node service clients e_stop (irobot_create_msgs/srv/EStop) and robot_power (RobotPower); relayed per
    republisher.yaml robot_services
  interface: service
  ros_name: /e_stop, /robot_power
  message_type: irobot_create_msgs/srv/EStop (bool e_stop_on), irobot_create_msgs/srv/RobotPower
  rate_hz: event-driven
  qos: services default reliable
  mapping:
  - condition: e_stop request e_stop_on=true
    state: safety_stop
    reason: safety
    scope: base
    event_type: transition
    actor_id: null
  - condition: e_stop request e_stop_on=false
    state: unknown
    reason: null
    scope: base
    event_type: transition
    actor_id: null
  - condition: robot_power request (power off; also automatic after 60 s at <=12% battery when undocked)
    state: idle
    reason: null
    scope: whole_robot
    event_type: session_end
    actor_id: null
  uncovered_cases:
  - 'Service calls are not observable as topics: a passive observer cannot see the request; only the effect on /wheel_status
    (T11) and the announcement on /function_calls (T6) are visible. Propose: log safety_stop from wheel_status, attribute
    cause from function_calls within 1 s.'
  - Automatic low-battery power-off is a machine-initiated session end, not a human action; propose session_end with x_cause=low_battery.
  reliability: There is no hardware emergency-stop button on the TurtleBot 4 (manual hardware pages list only Create 3 buttons,
    user buttons, display, LEDs); "EStop" is a software service that cuts motor power in firmware.
  observe_passively: Not directly (service); infer from /wheel_status and /function_calls.
  how_it_could_be_faked: Any client can call /e_stop; calling it with e_stop_on=false while turtlebot4_node believes wheels
    disabled breaks the toggle logic.
  tag: VERIFIED
  source_url:
