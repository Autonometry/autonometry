- id: N1
  name: NavigateToPose action goal status
  layer: task (bt_navigator)
  source: nav2_bt_navigator/bt_navigator (nav2_behavior_tree BtActionServer)
  interface: action
  ros_name: /navigate_to_pose/_action/status
  message_type: 'action_msgs/msg/GoalStatusArray (status: 1 ACCEPTED, 2 EXECUTING, 3 CANCELING, 4 SUCCEEDED, 5 CANCELED, 6
    ABORTED)'
  rate_hz: event-driven (published on every goal status change)
  qos: 'rcl_action status default: KeepLast(1), RELIABLE, TRANSIENT_LOCAL'
  mapping:
  - condition: status 2 EXECUTING for a goal on this server
    state: ai
    reason: null
    scope: base
    event_type: transition
    actor_id: ai:nav2_bt_navigator
  - condition: status 4 SUCCEEDED (and the Nav2 goal is the registered task)
    state: ai
    reason: null
    scope: base
    event_type: task_end
    actor_id: ai:nav2_bt_navigator
    note: outcome=success
  - condition: status 6 ABORTED after RecoveryNode exhausted 6 retries or non-recoverable error_code
    state: ai
    reason: null
    scope: base
    event_type: task_end
    actor_id: ai:nav2_bt_navigator
    note: outcome=failure
  - condition: status 3 CANCELING -> 5 CANCELED by a human client (RViz Cancel, BasicNavigator.cancelTask)
    state: shared
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:<device_id> (device registry)
  - condition: no goal EXECUTING, bt_navigator ACTIVE, no task open for >= idle_threshold_s
    state: idle
    reason: null
    scope: base
    event_type: transition
    actor_id: null
  uncovered_cases:
  - 'Status alone does not identify who sent the goal (RViz human vs. autonomous mission script); the action send_goal request
    is a service call that a passive topic observer cannot see. Proposed: treat the set of action clients on /navigate_to_pose/_action/send_goal
    seen in the ROS graph as the actor registry; if a declared human GUI node (e.g. rviz2) is the only client, attribute goals
    to it.'
  - CANCELED by an autonomous supervisor (e.g. waypoint_follower cancels navigate_to_pose on its own failure) is not human_initiated;
    the status topic cannot tell the two apart.
  reliability: 'Reliable + transient_local: a late-joining observer receives the last GoalStatusArray. Terminal statuses are
    kept for action_server_result_timeout = 900 s (nav2.yaml:10). Server inactive (lifecycle) -> no status published.'
  observe_passively: Subscribe with reliable/transient_local QoS; track goal_id -> status transitions; EXECUTING span = ai
    span on scope base.
  how_it_could_be_faked: Any node can publish on the status topic (plain topic, no authentication); a BT that never ticks
    FollowPath still reports EXECUTING; running a second bt_navigator under a namespace.
  tag: VERIFIED
  source_url:
  - https://github.com/ros-navigation/navigation2/blob/d5d768b7b38a05e7cfd2b6c693b786b402161bed/nav2_behavior_tree/include/nav2_behavior_tree/bt_action_server_impl.hpp#L150-L160
  - https://github.com/ros2/rcl_interfaces/blob/7aa3caf43377ea6ad615bc1040832e2c7566bfbe/action_msgs/msg/GoalStatus.msg
  - https://github.com/ros2/rcl/blob/18d96c9c2b98e616324ae9a2c7701dd0b0886ff0/rcl_action/include/rcl_action/default_qos.h#L26-L37
  - https://github.com/turtlebot/turtlebot4/blob/7fd29fb420e906f3aca4a904adb54b69b11c7c00/turtlebot4_navigation/config/nav2.yaml#L10-L13
  version: Nav2 1.3.14 (navigation2 jazzy d5d768b) as configured by turtlebot4 2.1.1 (jazzy 7fd29fb)
  track: nav2
