- id: N21
  name: Behavior action servers called directly (Spin / BackUp / DriveOnHeading / Wait)
  layer: behavior_server
  source: nav2_behaviors TimedBehavior action servers (behavior_plugins nav2.yaml:247)
  interface: action
  ros_name: /spin, /backup, /drive_on_heading, /wait (+ /_action/status, /_action/feedback)
  message_type: nav2_msgs/action/Spin, BackUp, DriveOnHeading, Wait; action_msgs/msg/GoalStatusArray
  rate_hz: event-driven; 10 Hz cycle (cycle_frequency nav2.yaml:246)
  qos: KeepLast(1), RELIABLE, TRANSIENT_LOCAL (status)
  mapping:
  - condition: EXECUTING as a child of the BT recovery subtree (N4 shows Spin/BackUp/Wait RUNNING)
    state: ai
    reason: null
    scope: base
    event_type: null
    actor_id: ai:nav2_bt_navigator
    note: none (recovery)
  - condition: EXECUTING with no Nav2 goal running, triggered by a human (BasicNavigator.spin()/backup()/driveOnHeading())
    state: human_remote (or human_local per device registry)
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:<device_id>
  - condition: Wait EXECUTING while a task is open, triggered by the BT
    state: ai
