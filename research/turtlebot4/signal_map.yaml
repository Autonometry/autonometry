- id: T13
  name: Create 3 hazards, kidnap and stop status NOT republished by default
  layer: create3_republisher config (turtlebot4_bringup)
  source: republisher.yaml robot_publishers list (hazard_detection, kidnap_status, stop_status, cliff_intensity, ir_intensity,
    ir_opcode, mouse, slip_status, wheel_ticks, wheel_vels are commented out)
  interface: topic
  ros_name: /hazard_detection, /kidnap_status, /stop_status (absent in robot namespace unless republisher.yaml is edited;
    present only under /_do_not_use/)
  message_type: irobot_create_msgs/msg/HazardDetectionVector, KidnapStatus, StopStatus
  rate_hz: n/a (not relayed)
  qos: n/a
  mapping:
  - condition: Hazard (bump/cliff/wheel drop) observed only if republisher.yaml is edited to relay hazard_detection
    state: safety_stop
    reason: safety
    scope: base
    event_type: transition
    actor_id: null
  uncovered_cases:
  - 'An observer on the robot namespace cannot see firmware safety reflexes (bump, cliff, wheel-drop, kidnap) with the default
    config: safety_stop intervals from reflexes become `unknown`/`ai`. Propose: integration note requires enabling hazard_detection,
    kidnap_status and stop_status in republisher.yaml, or observing /_do_not_use/* directly from the Pi.'
  reliability: Default config omits them; turtlebot4_diagnostics subscribes to hazard_detection and mouse and will report
    stale/no data by default.
  observe_passively: Edit republisher.yaml (robot-side change, so not strictly observe-only) or run the observer on the Pi
    subscribing to /_do_not_use/hazard_detection.
  how_it_could_be_faked: Leaving them disabled hides safety events from a namespace-level observer.
  tag: VERIFIED
  source_url:
