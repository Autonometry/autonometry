- id: N17
  name: Initial pose estimate (human corrects the robot's belief)
  layer: localization input (amcl)
  source: nav2_amcl initial_pose_sub_ 'initialpose'; also nav2_simple_commander setInitialPose publisher and TurtleBot4Navigator
    createPath subscriber
  interface: topic
  ros_name: /initialpose
  message_type: geometry_msgs/msg/PoseWithCovarianceStamped
  rate_hz: event-driven
  qos: SystemDefaultsQoS subscription; RViz publisher KeepLast(5) RELIABLE VOLATILE
  mapping:
  - condition: message while a task is open (AMCL particle reset)
    state: shared
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:<device_id>
    note: hint under hint_as_shared; return to ai after hint_ttl_s or when AMCL converges
  - condition: message before task_start (required set-up step per TB4 manual)
    state: no state change; set-up, not a hint
    reason: null
    scope: base
    event_type: null
    actor_id: null
    note: none
  - condition: message published by BasicNavigator.setInitialPose() from a mission script
    state: ai
    reason: null
    scope: base
    event_type: null
    actor_id: ai:nav2_bt_navigator
    note: none
  uncovered_cases:
  - 'A localization correction does not command actuators and does not change the goal; whether it is a ''hint'' (6.2: human
    information that changes AI behaviour) is a judgement call. Proposed: treat as hint (it changes the planned path) with
    hint_as_event and dwell_s = 0 by default, and report the sensitivity.'
  - TurtleBot4Navigator.createPath() reuses /initialpose clicks as waypoint input (not a localization reset) while creating_path
    is true; the same message has two meanings depending on client state.
  reliability: Discrete, reliable; AMCL only consumes it when ACTIVE.
  observe_passively: Subscribe; also watch /amcl_pose jump.
  how_it_could_be_faked: Any node can publish.
  tag: VERIFIED
  source_url:
