- id: T14
  name: RViz goal / initial pose / clicked point (human hints to Nav2)
  layer: turtlebot4_desktop (turtlebot4_viz navigation.rviz) on the user PC
  source: 'rviz2 tools: nav2_rviz_plugins/GoalTool, rviz_default_plugins/SetInitialPose (topic initialpose), rviz_default_plugins/PublishPoint
    (topic clicked_point)'
  interface: topic
  ros_name: '/initialpose, /clicked_point; GoalTool sends NavigateToPose action goals (Nav2 track) '
  message_type: geometry_msgs/msg/PoseWithCovarianceStamped, geometry_msgs/msg/PointStamped
  rate_hz: event-driven (one message per click)
  qos: Reliable, Keep Last 5, Volatile
  mapping:
  - condition: Nav2 goal clicked (NavigateToPose goal from rviz2 node on remote PC)
    state: shared
    reason: human_initiated
    scope: base
    event_type: hint
    actor_id: human:<operator_id> device:rviz_pc
  - condition: /initialpose published (localization correction)
    state: shared
    reason: human_initiated
    scope: base
    event_type: hint
    actor_id: human:<operator_id>
  - condition: /clicked_point published (TurtleBot4Navigator.createPath uses initialpose, not clicked_point)
    state: shared
    reason: human_initiated
    scope: base
    event_type: hint
    actor_id: human:<operator_id>
  uncovered_cases:
  - 'A goal click defines the task, not a hint, if issued before task_start (Section 6.2 last sentence); the same topic serves
    both roles -> propose: first goal after idle = task definition (task_start), subsequent goals inside an open task = hints.'
  - /initialpose is a localisation correction, not an actuator command; it changes AI behaviour so it is a hint (6.2) but
    it does not reflect human "work" on the robot; propose hint_as_event with dwell_s 0.
  reliability: Only present when the user PC runs rviz2; messages originate off-robot (remote by registry).
  observe_passively: Record /initialpose, /clicked_point and the Nav2 action goal topics (/navigate_to_pose/_action/* are
    hidden topics; see Nav2 track).
  how_it_could_be_faked: Any node can publish these topics; a script publishing goals looks like a human unless publisher
    identity is captured.
