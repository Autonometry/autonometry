- id: N16
  name: Topic-based navigation goal (RViz 'SetGoal' tool / scripts)
  layer: task input
  source: nav2_bt_navigator NavigateToPoseNavigator goal_sub_ on 'goal_pose' -> self action client sends NavigateToPose goal
  interface: topic
  ros_name: /goal_pose
  message_type: geometry_msgs/msg/PoseStamped
  rate_hz: event-driven
  qos: 'SystemDefaultsQoS subscription (RViz publisher: KeepLast(5), RELIABLE, VOLATILE per rviz config)'
  mapping:
  - condition: message before task_start (defines the task)
    state: no state change; task definition (not a hint)
    reason: null
    scope: base
    event_type: task_start
    actor_id: null
  - condition: message while a goal is EXECUTING (preempts the running goal with the same default BT)
    state: shared
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:<device_id>
    note: 'hint under hint_as_shared: human re-sets the goal while AI executes; returns to ai when consumed, i.e. when FollowPath
      resumes on the new path'
  - condition: message from an autonomous mission node
    state: ai
    reason: null
    scope: base
    event_type: task_start
    actor_id: ai:nav2_bt_navigator
  uncovered_cases:
  - 'The taxonomy''s ''human sets goals while AI executes'' (shared) versus ''instruction before task_start is the task definition''
    hinges on the task boundary; in Nav2 each goal is one action, so a re-goal is both a new Nav2 goal and a mid-task hint.
    Proposed: the task registry decides: if the registered task is ''reach pose P'', a new /goal_pose during execution is
    a hint (shared for hint_ttl_s or until GoalUpdated consumed); if the registered task is ''follow the operator''s goals
    for N minutes'' it is the task definition and the state stays ai.'
  - 'TB4''s model.rviz uses rviz_default_plugins/SetGoal on goal_pose, but navigation.rviz and robot.rviz use nav2_rviz_plugins/GoalTool,
    which sends the action goal directly (no topic): the same human click is observable on /goal_pose in one RViz config and
    invisible in the other.'
  reliability: Discrete; only the RViz configs that use SetGoal publish here.
  observe_passively: Subscribe; correlate with the new goal_id on N1 within ~100 ms.
  how_it_could_be_faked: Any node can publish.
  tag: VERIFIED
  source_url:
  - https://github.com/ros-navigation/navigation2/blob/d5d768b7b38a05e7cfd2b6c693b786b402161bed/nav2_bt_navigator/src/navigators/navigate_to_pose.cpp#L49-L52
  - https://github.com/ros-navigation/navigation2/blob/d5d768b7b38a05e7cfd2b6c693b786b402161bed/nav2_bt_navigator/src/navigators/navigate_to_pose.cpp#L268-L274
  - https://github.com/ros-navigation/navigation2/blob/d5d768b7b38a05e7cfd2b6c693b786b402161bed/nav2_bt_navigator/src/navigators/navigate_to_pose.cpp#L196-L225
  - https://github.com/turtlebot/turtlebot4_desktop/blob/d831a5a3d2323d2db1ce79e5b909beecbeed3dcf/turtlebot4_viz/rviz/model.rviz#L331-L337
  - https://github.com/turtlebot/turtlebot4_desktop/blob/d831a5a3d2323d2db1ce79e5b909beecbeed3dcf/turtlebot4_viz/rviz/navigation.rviz#L741
  - https://github.com/turtlebot/turtlebot4_desktop/blob/d831a5a3d2323d2db1ce79e5b909beecbeed3dcf/turtlebot4_viz/rviz/robot.rviz#L348
  - https://github.com/ros-navigation/navigation2/blob/d5d768b7b38a05e7cfd2b6c693b786b402161bed/nav2_rviz_plugins/src/goal_tool.cpp#L44-L49
  - https://github.com/ros-navigation/navigation2/blob/d5d768b7b38a05e7cfd2b6c693b786b402161bed/nav2_rviz_plugins/src/nav2_panel.cpp#L1299-L1326
  version: Nav2 1.3.14 (navigation2 jazzy d5d768b) as configured by turtlebot4 2.1.1 (jazzy 7fd29fb)
