- id: N6
  name: AssistedTeleop action status (shared control span)
  layer: behavior_server
  source: nav2_behaviors::AssistedTeleop (nav2.yaml:256-257)
  interface: action
  ros_name: /assisted_teleop/_action/status; feedback /assisted_teleop/_action/feedback current_teleop_duration
  message_type: action_msgs/msg/GoalStatusArray; nav2_msgs/action/AssistedTeleop {goal time_allowance; result total_elapsed_time,
    error_code NONE=0/UNKNOWN=730/TIMEOUT=731/TF_ERROR=732}
  rate_hz: event-driven; behavior cycle 10 Hz (cycle_frequency nav2.yaml:246)
  qos: KeepLast(1), RELIABLE, TRANSIENT_LOCAL
  mapping:
  - condition: 'EXECUTING: human twist on cmd_vel_teleop is collision-filtered and republished to cmd_vel (-> cmd_vel_nav)'
    state: shared
