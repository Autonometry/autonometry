  interface: topic
  ros_name: /cmd_vel_smoothed
  message_type: geometry_msgs/msg/TwistStamped
  rate_hz: 20 Hz wall timer (smoothing_frequency nav2.yaml:282); stops publishing once zero reached after velocity_timeout
