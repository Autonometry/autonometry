  interface: action
  ros_name: /navigate_to_pose/_action/feedback (also /navigate_through_poses/_action/feedback with number_of_poses_remaining)
  message_type: nav2_msgs/action/NavigateToPose Feedback {current_pose, navigation_time, estimated_time_remaining, number_of_recoveries,
    distance_remaining}
  rate_hz: once per BT loop while a goal runs (bt_loop_duration 10 ms -> up to 100 Hz)
