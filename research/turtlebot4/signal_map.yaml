- id: B11
  name: interface_buttons (three faceplate buttons)
  layer: hardware UI -> firmware topic
  source: Create 3 firmware /ui_mgr
  interface: topic
  ros_name: /interface_buttons
  message_type: 'irobot_create_msgs/msg/InterfaceButtons (Button button_1, button_power, button_2; Button: bool is_pressed,
    Time last_start_pressed_time, Duration last_pressed_duration)'
  rate_hz: 'UNKNOWN (ui.md: ''Whenever a button ... is pressed, its information will be published'')'
  qos: UNKNOWN
  mapping:
  - condition: button_1 short press on TB4 (default map 'Dock') -> firmware dock action requested by a co-located human
    state: shared
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: <local actor_id>
  - condition: button_2 short press on TB4 (default 'Undock')
    state: shared
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: <local actor_id>
  - condition: button_power short press on TB4 (default 'EStop' = /e_stop toggle)
    state: safety_stop
    reason: safety
    scope: base
    event_type: transition
    actor_id: null
  - condition: button_1 long press 2000 ms ('Wall Follow Left') / button_2 long press ('Wall Follow Right')
    state: shared
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: <local actor_id>
  - condition: 'button_power long press 3000 ms (''Power'' = /robot_power): robot and payload power off -> observer loses
      the source; proposed session_end with x_cause (see uncovered_cases), else unknown'
    state: unknown
    reason: null
    scope: base
    event_type: transition
    actor_id: null
  - condition: 'button_1 held 10 s: firmware standby/low-power (no Wi-Fi/USB/BLE response); center 7 s: storage mode/off ->
      observer loses the source; proposed session_end with x_cause (see uncovered_cases), else unknown'
    state: unknown
    reason: null
    scope: base
    event_type: transition
    actor_id: null
  uncovered_cases:
  - 'A physical button on the robot body is a local device by nature, but definitions 6.10 classify any undeclared device
    as human_remote; proposed: the device registry pre-declares create3_button_1/_2/_power as local.'
  - 'Firmware-level holds (10 s standby, 7 s storage) act regardless of the TB4 mapping and end logging without a session_end
    from the robot; proposed: observer emits session_end with x_cause=base_power_hold when all base topics vanish within 5
    s of a >=7 s power-button press.'
  - Button presses that only trigger menu/UI functions are not control events; only functions that command motion/inhibition
    map to states.
  reliability: Publication semantics (edge vs. periodic) undocumented; long-press durations are TB4 parameters and can be
    changed.
  observe_passively: Subscribe best-effort; use last_start_pressed_time and last_pressed_duration (firmware clock) to classify
    short/long presses with the TB4 thresholds (2000/3000 ms).
  how_it_could_be_faked: turtlebot4.yaml can remap any button to any function; the firmware-level 7 s/10 s holds cannot be
    remapped.
  tag: VERIFIED
  source_url:
