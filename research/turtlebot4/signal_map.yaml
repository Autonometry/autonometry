- id: T6
  name: Button/menu function call announcement
  layer: turtlebot4_node
  source: turtlebot4_node (function_call_pub_)
  interface: topic
  ros_name: /function_calls
  message_type: 'std_msgs/msg/String (data = function name: Dock, Undock, Wall Follow Left, Wall Follow Right, EStop, Power,
    RPLIDAR Start/Stop, OAKD Start/Stop, Scroll Up, Scroll Down, Select, Back, Help)'
  rate_hz: event-driven (one message per button short/long press or menu select)
  qos: KeepLast(10), default reliable, volatile
  mapping:
  - condition: data == "Dock" or "Undock" (human pressed Create 3 button 1/2, controller Home, or menu Select)
    state: human_local
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:<operator_id>
  - condition: 'data == "EStop" (toggles Create 3 e_stop: ON when wheels_enabled_, OFF otherwise)'
    state: safety_stop
    reason: safety
    scope: base
    event_type: transition
    actor_id: null
  - condition: data == "EStop" when wheels were disabled (clears e-stop)
    state: idle
    reason: planned
    scope: base
    event_type: transition
    actor_id: null
  - condition: data == "Wall Follow Left"/"Wall Follow Right" (firmware behaviour, max_runtime 10 s)
    state: shared
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:<operator_id>
  - condition: data == "Power" (robot_power service -> power off)
    state: idle
    reason: null
    scope: whole_robot
    event_type: session_end
    actor_id: null
  - condition: data in Scroll Up/Scroll Down/Back/Select/Help (display navigation only)
    state: unknown
    reason: null
    scope: display
    event_type: hint
    actor_id: null
  uncovered_cases:
  - The message carries the function name only, not which physical button or which human triggered it; Create 3 faceplate
    button vs controller vs menu are indistinguishable here (use /interface_buttons, /joy, /hmi/buttons to disambiguate).
  - 'Dock/Undock are Create 3 firmware actions (autonomous docking) started by a human: human-triggered autonomy has no state
    in v0.2 (human sets goal while AI executes = `shared` per Section 2 definition) -> propose `shared`/human_initiated during
    the action, which is what the mapping above should use instead of human_local once the action is accepted.'
  - 'Clearing an e-stop with the same button: state after clearing is whatever controller resumes; the taxonomy has no "safety_stop
    released" reason -> propose transition to previous state with reason null and related_seq.'
  - 'Display scroll/select events are not control of any motion scope: `display` is not an actuated scope (Section 14E) ->
    record as x_ui_event, not a hint.'
  reliability: Published before the function callback executes, so it records the attempt even if the action server is unavailable
    (action client waits in a 1 s timer with no timeout).
  observe_passively: Subscribe to /function_calls (namespaced).
  how_it_could_be_faked: Any node can publish /function_calls (observer would log a phantom action); conversely a modified
    turtlebot4.yaml can rebind buttons to other functions, so function name != physical button.
  tag: VERIFIED
  source_url:
  - https://github.com/turtlebot/turtlebot4/blob/7fd29fb420e906f3aca4a904adb54b69b11c7c00/turtlebot4_node/src/turtlebot4.cpp#L153
