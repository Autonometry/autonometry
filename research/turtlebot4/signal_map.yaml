- id: N9
  name: Collision monitor state (software safety stop / approach)
  layer: collision_monitor (last node before the base bridge)
  source: nav2_collision_monitor::CollisionMonitor (nav2.yaml:294-324)
  interface: topic
  ros_name: /collision_monitor_state
  message_type: 'nav2_msgs/msg/CollisionMonitorState {action_type: DO_NOTHING=0, STOP=1, SLOWDOWN=2, APPROACH=3, LIMIT=4;
    polygon_name}'
  rate_hz: 'event-driven: published only when the acting polygon_name changes (collision_monitor_node.cpp:510-513); process()
    runs once per incoming cmd_vel_smoothed message'
  qos: 'create_publisher(state_topic, 1): KeepLast(1), RELIABLE, VOLATILE'
  mapping:
  - condition: action_type STOP with polygon_name 'invalid source' (scan older than source_timeout 1.0 s, nav2.yaml:303) or
      a stop polygon (none configured on TB4)
    state: safety_stop
    reason: safety
    scope: base
    event_type: transition
    actor_id: null
  - condition: 'action_type APPROACH, polygon FootprintApproach (time_before_collision 1.2 s, nav2.yaml:313): velocity scaled,
      motion continues'
    state: ai
    reason: null
    scope: base
    event_type: null
    actor_id: ai:nav2_bt_navigator
    note: none (x_collision_monitor_approach quality flag)
  - condition: action_type DO_NOTHING after a STOP
    state: previous state (ai per N1)
    reason: null
    scope: base
    event_type: transition
    actor_id: ai:nav2_bt_navigator
  - condition: SLOWDOWN / LIMIT
    state: 'not configured on TB4; if configured: ai (speed-limited, still AI-commanded)'
    reason: null
    scope: base
    event_type: null
    actor_id: ai:nav2_bt_navigator
    note: none
  uncovered_cases:
  - 'APPROACH can scale the commanded velocity to exactly zero when collision_time is 0 (change_ratio = 0) without ever reporting
    STOP: the robot is held by a safety function but the state topic says APPROACH. Proposed: treat APPROACH with cmd_vel
    output == 0 for > gap_tolerance_s as safety_stop (reason safety) and flag x_approach_zero.'
  - The 'invalid source' STOP stops the robot when the lidar is silent; this is a safety_stop that no human triggered and
    that can persist indefinitely (no takeover) -> counted in safety_stops only, per 6.7.
  - 'Change-only publication + VOLATILE: a late joiner does not know the current action_type until it changes. Proposed: observer
    also reads /cmd_vel_smoothed vs /cmd_vel to infer the current action.'
  reliability: Only emitted on change; nothing emitted when no cmd_vel_smoothed arrives (the monitor is message-driven, no
    timer).
  observe_passively: Subscribe (reliable, depth 1); compare /cmd_vel_smoothed and /cmd_vel to confirm.
  how_it_could_be_faked: ~/toggle service (N24) disables the monitor silently (state topic not published while enabled_ is
    false); publish fake state.
  tag: VERIFIED
  source_url:
