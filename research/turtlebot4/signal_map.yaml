- id: N13
  name: Lifecycle transition events of every Nav2 server
  layer: lifecycle
  source: rcl_lifecycle (via rclcpp_lifecycle / nav2_util::LifecycleNode) for bt_navigator, controller_server, planner_server,
    smoother_server, route_server, behavior_server, velocity_smoother, collision_monitor, waypoint_follower, docking_server,
    map_server, amcl
  interface: topic
  ros_name: /<node>/transition_event (e.g. /bt_navigator/transition_event, /collision_monitor/transition_event)
  message_type: lifecycle_msgs/msg/TransitionEvent {timestamp (uint64, never set by rcl_lifecycle -> 0), transition, start_state,
    goal_state}; states UNCONFIGURED=1, INACTIVE=2, ACTIVE=3, FINALIZED=4
  rate_hz: event-driven
  qos: 'rcl_publisher_get_default_options(): rmw default (KeepLast(10), RELIABLE, VOLATILE) [CLAIM for the rmw default profile
    values]'
  mapping:
  - condition: bt_navigator (or controller_server, velocity_smoother, collision_monitor) goal_state != ACTIVE while no task
      is open
    state: idle
    reason: null
    scope: base
    event_type: transition
    actor_id: null
  - condition: bt_navigator or controller_server leaves ACTIVE while a Nav2 goal is EXECUTING (lifecycle manager PAUSE/RESET
      or bond failure)
    state: unknown
    reason: null
    scope: base
    event_type: transition
    actor_id: null
  - condition: collision_monitor leaves ACTIVE while others run
    state: no state change; flag x_safety_layer_inactive
    reason: null
    scope: base
    event_type: null
    actor_id: null
    note: none
  uncovered_cases:
  - 'A PAUSE issued by a human via manage_nodes (N14) during an open task is a hold caused by a human (6.8 -> shared, human_initiated),
    but the transition_event does not say who requested it. Proposed: log human lifecycle commands from the device registry
    side (the GUI/CLI used) and fall back to unknown.'
  - 'Volatile: a late joiner does not learn the current lifecycle state from this topic; it must call /<node>/get_state (lifecycle_msgs/srv/GetState),
    which is an active (non-passive) query.'
  reliability: Reliable but volatile; the TransitionEvent.timestamp field is 0, so the observer must stamp on receipt.
  observe_passively: Subscribe to every /<node>/transition_event; optionally query get_state once at start (active query,
    declare it).
  how_it_could_be_faked: Publish fake events; run nodes outside the lifecycle manager.
  tag: VERIFIED
  source_url:
