- id: T15
  name: Create 3 motion actions called from TB4 layer (dock, undock, wall_follow, drive_distance, rotate_angle)
  layer: turtlebot4_node / TurtleBot4Navigator / turtlebot4_tests -> create3_republisher -> Create 3
  source: Action clients in turtlebot4_node (dock, undock, wall_follow, led_animation), turtlebot4_navigator.py (dock, undock),
    ros_tests.py (drive_distance, rotate_angle, dock, undock)
  interface: action
  ros_name: /dock, /undock, /wall_follow, /drive_distance, /rotate_angle, /drive_arc, /navigate_to_position (all relayed per
    republisher.yaml robot_actions)
  message_type: irobot_create_msgs/action/Dock, Undock, WallFollow, DriveDistance, RotateAngle, DriveArc, NavigateToPosition
  rate_hz: event-driven (goal/feedback/result)
  qos: action default (services reliable; feedback/status per rcl_action defaults)
  mapping:
  - condition: drive_distance / rotate_angle goals from turtlebot4_tests ros_tests.py (fixed 0.25 m, pi/2, 4 repetitions)
    state: scripted
    reason: null
    scope: base
    event_type: transition
    actor_id: script:turtlebot4_tests
  - condition: dock/undock goal from TurtleBot4Navigator in a user script with no human in the loop
    state: ai
    reason: null
    scope: base
    event_type: transition
    actor_id: ai:create3_dock
  - condition: dock/undock goal from turtlebot4_node after a human button press
    state: shared
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:<operator_id>
  - condition: wall_follow goal (firmware reactive behaviour, 10 s) after human button
    state: shared
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:<operator_id>
  uncovered_cases:
  - 'drive_distance/rotate_angle are open-loop-ish firmware motions parameterised by a script: `scripted` fits (fixed sequence)
    although the firmware uses odometry feedback (limit checks allowed by 6.9).'
  - Dock is autonomous (IR-guided) but mechanical/charging state, not "work"; whether docking time is active AI time is undefined
    -> propose active `ai` if inside a task (e.g. patrol with recharge), `idle` between tasks after idle_threshold_s.
  reliability: Action status is visible on hidden topics /<action>/_action/status (Nav2 track describes the same mechanism);
    goal acceptance is logged by turtlebot4_node at INFO level only.
  observe_passively: Subscribe to /dock/_action/status, /undock/_action/status, /wall_follow/_action/status, /drive_distance/_action/status,
    /rotate_angle/_action/status (action_msgs/msg/GoalStatusArray) with `--include-hidden-topics`.
  how_it_could_be_faked: A spoof action server is not possible while the republisher relays the real one on the same name
