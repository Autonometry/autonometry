- id: N4
  name: Behavior tree status-change log
  layer: task (BT ticks)
  source: nav2_behavior_tree RosTopicLogger on bt_navigator_navigate_to_pose_rclcpp_node / bt_navigator_navigate_through_poses_rclcpp_node
  interface: topic
  ros_name: /behavior_tree_log
  message_type: 'nav2_msgs/msg/BehaviorTreeLog {timestamp, event_log[]: BehaviorTreeStatusChange {timestamp,node_name,uid,previous_status,current_status}}'
  rate_hz: event-driven; flushed once per BT loop (bt_loop_duration 10 ms, nav2.yaml:7) only when changes occurred
  qos: 'rclcpp::QoS(10): KeepLast(10), RELIABLE, VOLATILE'
  mapping:
  - condition: FollowPath or ComputePathToPose RUNNING
    state: ai
    reason: null
    scope: base
    event_type: transition
    actor_id: ai:nav2_bt_navigator
  - condition: Spin / BackUp / Wait / ClearEntireCostmap RUNNING (recovery subtree)
    state: ai
    reason: null
    scope: base
    event_type: transition
    actor_id: ai:nav2_bt_navigator
    note: recovery is the controller reacting to sensing; count as quality signal x_recovery
  - condition: GoalUpdated SUCCESS during a running goal (goal replaced by preemption)
    state: shared
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:<device_id>
    note: only if the new goal came from a declared human device; see N1 uncovered
  - condition: NavigateRecovery FAILURE (root)
    state: ai
    reason: null
    scope: base
    event_type: task_end
    actor_id: ai:nav2_bt_navigator
    note: outcome=failure
  uncovered_cases:
  - Only published while a BT is executing; between goals there is no log, so idle vs unknown must come from N1/N13.
  - 'VOLATILE: a late joiner misses earlier events and cannot reconstruct the node state; the per-event timestamp is BehaviorTree.CPP''s
    own clock, not ROS time.'
  - 'Nav2 has no ''ask for help'' BT node in the default trees: planner/controller failure with retries exhausted ends as
    ABORTED, never as a help_request.'
  reliability: Reliable but volatile; depth 10 messages. Lost if bt_navigator restarts. Node names in the default XML are
    unique enough (NavigateRecovery, FollowPath, ComputePathToPose, RecoveryFallback, RecoveryActions, Spin, Wait, BackUp,
    ClearLocalCostmap-Subtree, ClearGlobalCostmap-Subtree).
  observe_passively: Subscribe; map node_name/current_status to spans; use uid to disambiguate.
  how_it_could_be_faked: Any node can publish; a custom BT XML (goal.behavior_tree field) can omit recovery nodes or rename
    them.
  tag: VERIFIED
  source_url:
  - https://github.com/ros-navigation/navigation2/blob/d5d768b7b38a05e7cfd2b6c693b786b402161bed/nav2_behavior_tree/include/nav2_behavior_tree/ros_topic_logger.hpp#L49-L51
  - https://github.com/ros-navigation/navigation2/blob/d5d768b7b38a05e7cfd2b6c693b786b402161bed/nav2_behavior_tree/include/nav2_behavior_tree/ros_topic_logger.hpp#L61-L76
  - https://github.com/ros-navigation/navigation2/blob/d5d768b7b38a05e7cfd2b6c693b786b402161bed/nav2_behavior_tree/include/nav2_behavior_tree/bt_action_server_impl.hpp#L315-L321
  - https://github.com/ros-navigation/navigation2/blob/d5d768b7b38a05e7cfd2b6c693b786b402161bed/nav2_msgs/msg/BehaviorTreeStatusChange.msg
  - https://github.com/ros-navigation/navigation2/blob/d5d768b7b38a05e7cfd2b6c693b786b402161bed/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
  version: Nav2 1.3.14 (navigation2 jazzy d5d768b) as configured by turtlebot4 2.1.1 (jazzy 7fd29fb)
  track: nav2
- id: N5
  name: NavigateToPose feedback (recovery counter, navigation time)
  layer: task (bt_navigator)
