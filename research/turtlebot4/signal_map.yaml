- id: B10
  name: Firmware autonomous behaviours (dock, undock, wall_follow) and drive goals (drive_distance, rotate_angle, drive_arc,
    navigate_to_position)
  layer: firmware action servers
  source: Create 3 firmware /motion_control
  interface: action
  ros_name: /dock, /undock, /wall_follow, /drive_distance, /rotate_angle, /drive_arc, /navigate_to_position
  message_type: irobot_create_msgs/action/{Dock,Undock,WallFollow,DriveDistance,RotateAngle,DriveArc,NavigateToPosition}
  rate_hz: event-driven (goal/feedback/result); feedback rate UNKNOWN
  qos: rmw action defaults
  mapping:
  - condition: goal accepted and requested by an automated controller (Nav2 behaviour tree, mission node)
    state: ai
    reason: null
    scope: base
    event_type: transition
    actor_id: ai:create3:<action>
  - condition: 'goal requested by a human (TB4 button Dock/Undock/Wall Follow, CLI, GUI): human sets goal, firmware executes
      = shared (definitions 2, ''human sets goals while AI executes'')'
    state: shared
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: <actor_id>
  - condition: goal cancelled by firmware on CLIFF/STALL (drive goals) -> motion stopped by a safety function
    state: safety_stop
    reason: safety
    scope: base
    event_type: transition
    actor_id: null
  - condition: 'goal pre-empts cmd_vel: ''cmd_vel messages ... will be ignored until the goal terminates'' -> any concurrent
      teleop is not in control -> the ignored commander''s state is not asserted; unknown only if no other evidence'
    state: unknown
    reason: null
    scope: base
    event_type: transition
    actor_id: null
  uncovered_cases:
  - The firmware does not expose the goal's requester; action status topics carry goal_id only (hidden topic naming per ROS
    2 design — CLAIM). Requester identity must be taken from the DDS graph (action client node name) at goal time.
  - 'Safety features are temporarily re-enabled during built-in behaviours (safety.md L10): an operator-set safety_override:
    full is overridden by the firmware — no state change, but the x_safety_override value an observer records becomes stale.'
  - 'A human publishing cmd_vel during an action is ignored by the firmware: is that an attempted intervention? v0.2 counts
    transitions by actual control; proposed: log a hint-like x_ignored_command event, no transition.'
  reliability: Goal lifecycle is reliable (actions are reliable by default); which behaviour is active is visible only through
    the action status topics or the ROS graph.
  observe_passively: Subscribe to each action's status and feedback topics (names per ROS 2 action design, not verified here)
    or watch /rosout for the firmware warning about ignored velocities (sim text; real firmware text UNKNOWN).
  how_it_could_be_faked: A mission node can call /dock under a human-looking node name and vice versa.
