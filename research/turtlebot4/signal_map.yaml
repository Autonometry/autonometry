autonomy_meter_signal_map:
  platform: 'TurtleBot 4 (Standard and Lite): iRobot Create 3 base + Raspberry Pi 4B + ROS 2 Jazzy + Nav2 1.3.14'
  taxonomy: definitions.md v0.2 (2026-10-31) and event.schema.json v0.2
  pins:
    turtlebot4: turtlebot/turtlebot4@7fd29fb420e906f3aca4a904adb54b69b11c7c00 (jazzy)
    turtlebot4_robot: turtlebot/turtlebot4_robot@28e115f86930bb3273f1a1aa4738dbd8747513f0 (jazzy)
    turtlebot4_desktop: turtlebot/turtlebot4_desktop@d831a5a3d2323d2db1ce79e5b909beecbeed3dcf (jazzy)
    turtlebot4_simulator: turtlebot/turtlebot4_simulator@b7d0f3b973258481f6cd8137bef9240fb567f566 (jazzy)
    turtlebot4_setup: turtlebot/turtlebot4_setup@5fe58657aeff57d28cb2cfb4f0c6cc6c62a4b96c (jazzy)
    turtlebot4-user-manual: turtlebot/turtlebot4-user-manual@4455a75dde3f052b5abf615dade22bece84120b0 (gh-pages)
    irobot_create_msgs: iRobotEducation/irobot_create_msgs@b4986ef5dc2e07d8aa7471f29c56b617473352c5 (jazzy)
    create3_docs: iRobotEducation/create3_docs@9fb1510bbceb0e01c4764ddc458da59487519dca (main)
    create3_sim: iRobotEducation/create3_sim@6c305843afcfe094bf8eb2a0c6997f531e526b9d (jazzy)
    create3_examples: iRobotEducation/create3_examples@fe3d408a266b755b94cb7334a92f2d58dd661c13 (jazzy)
    navigation2: ros-navigation/navigation2@d5d768b7b38a05e7cfd2b6c693b786b402161bed (jazzy)
    docs.nav2.org: ros-navigation/docs.nav2.org@74f751f161154075af6c2b4b9cd60bebf417cab8 (rolling)
  access_date: 2026-10-31 (pinned trees); 2026-11-03 for live web fetches marked in source_url notes
  signal_id_prefixes:
    B: Create 3 base firmware / irobot_create_msgs
    T: TurtleBot 4 software layer (turtlebot4, turtlebot4_robot, setup, desktop, simulator)
    N: Nav2 1.3.14 as configured by turtlebot4_navigation
    E: External dataset label columns (substitute datasets; none recorded on TB4)
  mapping_vocabulary:
    state:
    - ai
    - human_local
    - human_remote
    - shared
    - scripted
    - safety_stop
    - idle
    - unknown
    reason:
    - ai_requested_help
    - human_initiated
    - safety
    - planned
    - null
    event_type:
    - approval
    - heartbeat
    - help_request
    - hint
    - session_end
    - session_start
    - supervision
    - task_end
    - task_start
    - transition
  scopes: base is the only actuated motion scope; display, LEDs, audio, camera, lidar motor are not scopes (dossier 14E)
  note: event_type values that a track annotated in parentheses were normalised to the enum; the annotation was moved to mapping[].note.
    Uncovered cases per signal are in uncovered_cases; the lead decisions are in dossier.md "Uncovered cases".
signals:
- id: B1
  name: cmd_vel velocity command (unstamped)
  layer: firmware input
  source: Create 3 firmware /motion_control node
  interface: topic
  ros_name: '/cmd_vel (TB4: the robot-side name reached through create3_republisher remaps; on the Pi the TwistStamped stream
    is /cmd_vel and the Twist stream is /cmd_vel_unstamped)'
  message_type: geometry_msgs/msg/Twist
  rate_hz: publisher-defined (docs example 20 Hz); firmware stops wheels 0.5 s after last message (wheels_stop_threshold_sec)
  qos: firmware subscription QoS UNKNOWN (create3_sim uses SensorDataQoS = best-effort)
  mapping:
  - condition: cmd_vel publisher is the navigation stack (DDS publisher node identity = Nav2 controller/collision monitor)
      and no firmware action goal is active
    state: ai
    reason: null
    scope: base
    event_type: transition
    actor_id: ai:nav2
  - condition: cmd_vel publisher is a teleop node (teleop_twist_joy/teleop_twist_keyboard) whose device is declared local
      in the registry
    state: human_local
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: <operator actor_id>
  - condition: cmd_vel publisher is a teleop node whose device is declared remote, or is undeclared (definitions 6.10)
    state: human_remote
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: <operator actor_id>
  uncovered_cases:
  - 'The firmware gives no source attribution for cmd_vel: two publishers on one topic are both executed ''last message wins''
    at the firmware (no mux in TB4 stack); attribution must come from DDS publisher identity, which an observer can only sample
    (ros2 topic info -v), not per-message.'
  - 'cmd_vel timeout stop after link loss (publisher vanished from graph) vs. operator holding still: proposed = safety_stop/safety
    when the publisher''s DDS liveliness is lost, hold-of-current-actor when it is alive.'
  - Firmware release note says 'don't use cmd_vel and cmd_vel_stamped at the same time' but does not define which wins.
  - 'No-transition rule: cmd_vel stream stops (>0.5 s) while the publishing node is still alive in the DDS graph: hold by
    the current actor (definitions 6.8); no transition'
  reliability: High for presence of a command; zero for who sent it. Ignored entirely while a firmware action goal runs (moving-the-robot.md
    L48-50).
  observe_passively: Subscribe best-effort to the Pi-side topics (/cmd_vel TwistStamped and /cmd_vel_unstamped Twist in TB4)
    and sample publisher node names via the ROS graph API; compare with /wheel_vels and /odom twist to detect commands executed
    from sources not visible on ROS 2.
  how_it_could_be_faked: A human teleop node can publish under a node name that looks like an AI controller; nothing in the
    message carries identity. A joystick can be relayed through a 'nav' namespace.
  tag: VERIFIED
  source_url:
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/api/moving-the-robot.md#L19
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/api/moving-the-robot.md#L26
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/api/moving-the-robot.md#L48
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/releases/h_2_5.md#L29
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/releases/i_0_0.md#L25
  - https://github.com/turtlebot/turtlebot4_robot/blob/28e115f86930bb3273f1a1aa4738dbd8747513f0/turtlebot4_bringup/launch/robot.launch.py#L86
  - https://iroboteducation.github.io/create3_docs/api/moving-the-robot/
  version: Create 3 firmware I.0.0 (irobot_create_msgs 2.1.0 on robot; 3.0.0 pinned, interface-identical per CHANGELOG)
  track: base
- id: B2
  name: cmd_vel_stamped velocity command
  layer: firmware input
  source: Create 3 firmware /motion_control node
  interface: topic
  ros_name: /cmd_vel_stamped (robot side; remapped to /cmd_vel on the TB4 Pi)
  message_type: geometry_msgs/msg/TwistStamped
  rate_hz: publisher-defined; same 0.5 s stale timeout assumed (documented only for /cmd_vel)
  qos: UNKNOWN
  mapping:
  - condition: same as B1; this is the stream Nav2 uses on TB4 Jazzy (enable_stamped_cmd_vel true)
    state: ai
    reason: null
    scope: base
    event_type: transition
    actor_id: ai:nav2
  uncovered_cases:
  - Timeout for cmd_vel_stamped is not documented (release note defines wheels_stop_threshold_sec for /cmd_vel only).
  reliability: As B1. header.stamp is the publisher's clock, not the firmware's.
  observe_passively: Subscribe best-effort; the TwistStamped header lets the observer measure publisher-to-observer latency.
  how_it_could_be_faked: As B1.
  tag: VERIFIED
  source_url:
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/releases/i_0_0.md#L25
  - https://github.com/turtlebot/turtlebot4_robot/blob/28e115f86930bb3273f1a1aa4738dbd8747513f0/turtlebot4_bringup/launch/robot.launch.py#L87
  - https://github.com/turtlebot/turtlebot4_robot/blob/28e115f86930bb3273f1a1aa4738dbd8747513f0/turtlebot4_bringup/config/republisher.yaml#L34
  version: Create 3 firmware I.0.0 (irobot_create_msgs 2.1.0 on robot; 3.0.0 pinned, interface-identical per CHANGELOG)
  track: base
- id: B3
  name: wheel_vels measured wheel angular velocities
  layer: firmware output (actuation evidence)
  source: Create 3 firmware /robot_state (raw kinematics)
  interface: topic
  ros_name: /wheel_vels
  message_type: irobot_create_msgs/msg/WheelVels
  rate_hz: 62.5 (odometry.md L41; CLAIM — the wheel_vels section body of that page names wheel_status, an upstream copy error
    found at re-verification 2026-11-03) vs. throttled to raw_kinematics_min_pub_period_ms = 25 ms (40 Hz) by default since H.2.5
    — trust the release note
  qos: UNKNOWN
  mapping:
  - condition: '|velocity_left|+|velocity_right| > 0 while no cmd_vel publisher and no action goal is active: motion from
      a source invisible to ROS 2 (BLE app, reflex, physical push)'
    state: unknown
    reason: null
    scope: base
    event_type: transition
    actor_id: null
  uncovered_cases:
  - 'A reflex moves the wheels with zero/other cmd_vel: definitions have no state for a firmware safety *manoeuvre* (it is
    motion, not inhibition). Proposed: transition to ai (actor ai:create3_reflex) only if the episode exceeds a min_reflex_duration_s
    parameter, otherwise ignore.'
  reliability: Ground truth for actual wheel rotation; does not reveal commander. Can be disabled (raw_kinematics_min_pub_period_ms
    = -1).
  observe_passively: Subscribe best-effort; integrate for distance_m; cross-check against last cmd_vel to detect reflexes,
    pushes and hidden command paths.
  how_it_could_be_faked: 'Setting raw_kinematics_min_pub_period_ms: -1 in the webserver params file silently removes the topic.'
  tag: VERIFIED
  source_url:
  - https://github.com/iRobotEducation/irobot_create_msgs/blob/b4986ef5dc2e07d8aa7471f29c56b617473352c5/msg/WheelVels.msg#L4
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/api/odometry.md#L41
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/releases/h_2_5.md#L33
  - https://iroboteducation.github.io/create3_docs/api/odometry/
  version: Create 3 firmware I.0.0 (irobot_create_msgs 2.1.0 on robot; 3.0.0 pinned, interface-identical per CHANGELOG)
  track: base
- id: B4
  name: hazard_detection vector
  layer: firmware output (safety trigger)
  source: Create 3 firmware /robot_state
  interface: topic
  ros_name: /hazard_detection
  message_type: 'irobot_create_msgs/msg/HazardDetectionVector (HazardDetection.type enum: BACKUP_LIMIT=0, BUMP=1, CLIFF=2,
    STALL=3, WHEEL_DROP=4, OBJECT_PROXIMITY=5)'
  rate_hz: on change only by default (hazards_pub_fixed_period_ms = -1); publication can be disabled (publish_hazard_msgs=false)
  qos: UNKNOWN (create3_sim publishes SensorDataQoS().reliable())
  mapping:
  - condition: BACKUP_LIMIT present AND commanded linear.x < 0 AND wheel_vels ~ 0 (firmware refuses backward motion)
    state: safety_stop
    reason: safety
    scope: base
    event_type: transition
    actor_id: null
  - condition: 'CLIFF or STALL present during a firmware drive-goal action: firmware cancels the goal (drive-goals.md L15)
      -> motion stopped by a safety function'
    state: safety_stop
    reason: safety
    scope: base
    event_type: transition
    actor_id: null
  - condition: 'BUMP/CLIFF/WHEEL_DROP/STALL present and reflexes enabled: reflex manoeuvre in progress (see B3 uncovered)'
    state: unknown
    reason: null
    scope: base
    event_type: transition
    actor_id: null
  - condition: 'WHEEL_DROP on both wheels together with kidnap_status true: robot lifted by a person'
    state: human_local
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: <local actor_id>
  uncovered_cases:
  - 'BACKUP_LIMIT present while the robot drives forward is not an inhibition: no state change should be logged; the rule
    needs the commanded direction.'
  - 'OBJECT_PROXIMITY triggers the proximity-slowdown reflex (speed scaling of whatever is commanded): neither shared nor
    safety_stop in v0.2. Proposed: no transition; record as x_speed_limited=true on heartbeats.'
  - Whether the firmware inhibits cmd_vel toward a detected cliff when reflexes are disabled is not documented (UNKNOWN).
  reliability: Event-driven since H.2.5, so a dropped best-effort sample can be missed until the next change; detections carry
    their own header.stamp and frame_id.
  observe_passively: Subscribe best-effort; keep the latest vector as state; use detection header.stamp (firmware clock) as
    x_src_ts.
  how_it_could_be_faked: 'publish_hazard_msgs: false removes the topic; safety_override: full removes BACKUP_LIMIT hazards.'
  tag: VERIFIED
  source_url:
  - https://github.com/iRobotEducation/irobot_create_msgs/blob/b4986ef5dc2e07d8aa7471f29c56b617473352c5/msg/HazardDetection.msg#L8
  - https://github.com/iRobotEducation/irobot_create_msgs/blob/b4986ef5dc2e07d8aa7471f29c56b617473352c5/msg/HazardDetection.msg#L18
  - https://github.com/iRobotEducation/irobot_create_msgs/blob/b4986ef5dc2e07d8aa7471f29c56b617473352c5/msg/HazardDetectionVector.msg#L4
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/api/hazards.md#L13
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/api/hazards.md#L22
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/releases/h_2_5.md#L31
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/api/drive-goals.md#L15
  - https://iroboteducation.github.io/create3_docs/api/hazards/
  version: Create 3 firmware I.0.0 (irobot_create_msgs 2.1.0 on robot; 3.0.0 pinned, interface-identical per CHANGELOG)
  track: base
- id: B5
  name: kidnap_status
  layer: firmware output
  source: Create 3 firmware (sensor fusion)
  interface: topic
  ros_name: /kidnap_status
  message_type: irobot_create_msgs/msg/KidnapStatus (bool is_kidnapped)
  rate_hz: UNKNOWN ('periodically')
  qos: UNKNOWN
  mapping:
  - condition: is_kidnapped true (robot lifted and possibly moved by a person) with a task open
    state: human_local
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: <local actor_id>
  - condition: is_kidnapped true between tasks and the move is in the frozen plan
    state: human_local
    reason: planned
    scope: base
    event_type: transition
    actor_id: <local actor_id>
  - condition: 'is_kidnapped false after true: backup limit immediately triggers (safety.md L40); control returns to whoever
      commands next -> unknown until the next command/goal is observed'
    state: unknown
    reason: null
    scope: base
    event_type: transition
    actor_id: null
  uncovered_cases:
  - 'Kidnap by a lifting mechanism/elevator or a false positive (threshold crossing) is not a human; proposed: require is_kidnapped
    >= 1 s AND both WHEEL_DROP hazards before calling human_local, else unknown.'
  - 'Device registry (6.10): ''hands'' are not a device; proposed registry entry device_id=manual_handling, location=local.'
  reliability: Timestamp was wrong before G.5.3/H.2.3 (fixed). Rate undocumented.
  observe_passively: Subscribe best-effort; edge-detect is_kidnapped.
  how_it_could_be_faked: Cannot be disabled by parameter per docs; a robot carried on a cart with wheels loaded may not report
    kidnap.
  tag: VERIFIED
  source_url:
  - https://github.com/iRobotEducation/irobot_create_msgs/blob/b4986ef5dc2e07d8aa7471f29c56b617473352c5/msg/KidnapStatus.msg#L4
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/api/hazards.md#L87-L89
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/api/hazards.md#L92
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/api/safety.md#L40
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/releases/g_5_3.md#L24
  - https://iroboteducation.github.io/create3_docs/api/hazards/#the-kidnap_status-topic
  version: Create 3 firmware I.0.0 (irobot_create_msgs 2.1.0 on robot; 3.0.0 pinned, interface-identical per CHANGELOG)
  track: base
- id: B6
  name: stop_status (robot stopped estimate)
  layer: firmware output
  source: Create 3 firmware
  interface: topic
  ros_name: /stop_status
  message_type: irobot_create_msgs/msg/StopStatus (bool is_stopped)
  rate_hz: at least 1 Hz (G.4.5/H.1.2 note); odometry.md says 1 Hz
  qos: 'UNKNOWN (create3_sim: SensorDataQoS().reliable())'
  mapping:
  - condition: is_stopped true with no task open for >= idle_threshold_s
    state: idle
    reason: null
    scope: base
    event_type: transition
    actor_id: null
  uncovered_cases:
  - 1 Hz resolution is coarser than gap_tolerance_s=2 s only by a factor 2; sub-second stops are invisible here (use wheel_vels).
  - 'No-transition rule: is_stopped true with a task open: hold -> state of whoever caused it (6.8); stop_status alone cannot
    decide'
  reliability: Low temporal resolution; semantic only ('moving or not').
  observe_passively: Subscribe best-effort; use as idle detector together with task state.
  how_it_could_be_faked: Not configurable per docs.
  tag: VERIFIED
  source_url:
  - https://github.com/iRobotEducation/irobot_create_msgs/blob/b4986ef5dc2e07d8aa7471f29c56b617473352c5/msg/StopStatus.msg#L4
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/api/odometry.md#L67
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/releases/g_4_5.md#L17
  - https://iroboteducation.github.io/create3_docs/api/odometry/#the-stop_status-topic
  version: Create 3 firmware I.0.0 (irobot_create_msgs 2.1.0 on robot; 3.0.0 pinned, interface-identical per CHANGELOG)
  track: base
- id: B7
  name: wheel_status (wheels_enabled = not e-stopped; PWM; current)
  layer: firmware output (inhibition state)
  source: Create 3 firmware /motion_control
  interface: topic
  ros_name: /wheel_status
  message_type: irobot_create_msgs/msg/WheelStatus (int16 current_ma_left/right, int16 pwm_left/right, bool wheels_enabled)
  rate_hz: 62.5 (odometry.md) / throttled by raw_kinematics_min_pub_period_ms = 25 ms default (H.2.5)
  qos: 'UNKNOWN (create3_sim: SensorDataQoS().reliable())'
  mapping:
  - condition: wheels_enabled false (e_stop engaged via /e_stop service, e.g. TB4 power-button short press)
    state: safety_stop
    reason: safety
    scope: base
    event_type: transition
    actor_id: null
  - condition: 'wheels_enabled false -> true within takeover_window_s followed by human cmd_vel: one intervention (6.7) (human_local
      per device registry)'
    state: human_local
    reason: safety
    scope: base
    event_type: transition
    actor_id: <actor_id>
  - condition: 'wheels_enabled false -> true within takeover_window_s followed by human cmd_vel: one intervention (6.7) (human_remote
      per device registry)'
    state: human_remote
    reason: safety
    scope: base
    event_type: transition
    actor_id: <actor_id>
  - condition: wheels_enabled true again and AI resumes
    state: ai
    reason: null
    scope: base
    event_type: transition
    actor_id: ai:nav2
  uncovered_cases:
  - 'The ''half solid yellow'' light ring = wheels disabled is the only on-robot indication; the e-stop is a software service,
    not a hardware circuit — v0.2 treats both as safety_stop, which is correct but the trust review may want an x_estop_kind:
    software flag.'
  - Create 3 has no hardware E-stop; TB4 maps the power button short press to the software e_stop service, so the same button
    is both 'safety' (short) and 'power off' (3000 ms long press).
  reliability: Direct firmware state; subject to raw-kinematics throttling; disabled if raw_kinematics_min_pub_period_ms =
    -1.
  observe_passively: Subscribe best-effort; edge-detect wheels_enabled; pwm/current near zero with cmd_vel non-zero also indicates
    inhibition.
  how_it_could_be_faked: 'raw_kinematics_min_pub_period_ms: -1 removes the topic; e_stop can be cleared by any node calling
    /e_stop with e_stop_on false.'
  tag: VERIFIED
  source_url:
  - https://github.com/iRobotEducation/irobot_create_msgs/blob/b4986ef5dc2e07d8aa7471f29c56b617473352c5/msg/WheelStatus.msg#L8
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/api/safety.md#L79
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/api/safety.md#L91
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/hw/face.md#L69
  - https://github.com/iRobotEducation/create3_docs/blob/9fb1510bbceb0e01c4764ddc458da59487519dca/docs/releases/h_2_5.md#L33
  - https://github.com/turtlebot/turtlebot4_robot/blob/28e115f86930bb3273f1a1aa4738dbd8747513f0/turtlebot4_bringup/config/turtlebot4.yaml#L43
  - https://github.com/turtlebot/turtlebot4/blob/7fd29fb420e906f3aca4a904adb54b69b11c7c00/turtlebot4_node/src/turtlebot4.cpp#L523
  - https://iroboteducation.github.io/create3_docs/api/safety/#wheel-status
  version: Create 3 firmware I.0.0 (irobot_create_msgs 2.1.0 on robot; 3.0.0 pinned, interface-identical per CHANGELOG)
  track: base
- id: B8
  name: e_stop service
  layer: firmware input (inhibition command)
  source: Create 3 firmware /motion_control
  interface: service
  ros_name: /e_stop
  message_type: irobot_create_msgs/srv/EStop (bool e_stop_on -> bool success, string message)
  rate_hz: event-driven
  qos: rmw services default
  mapping:
  - condition: call with e_stop_on true from any client
    state: safety_stop
    reason: safety
    scope: base
    event_type: transition
    actor_id: null
  - condition: 'call with e_stop_on false: wheels re-enabled; state returns to whoever commands next (no state until a command/goal
      is observed)'
    state: unknown
    reason: null
    scope: base
    event_type: transition
    actor_id: null
  uncovered_cases:
