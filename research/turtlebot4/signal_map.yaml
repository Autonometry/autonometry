- id: T1
  name: Base velocity command (merged, all sources)
  layer: TB4 software stack / Create 3 interface
  source: Published by nav2 collision_monitor (Nav2), teleop_twist_joy_node (Bluetooth controller), teleop_twist_keyboard
    (SSH/PC), ros2 topic pub, any DDS participant; consumed by create3_republisher -> Create 3 firmware
  interface: topic
  ros_name: '/cmd_vel (namespaced: <ns>/cmd_vel); republished to Create 3 as <ns>/_do_not_use/cmd_vel_stamped'
  message_type: geometry_msgs/msg/TwistStamped (Jazzy); legacy geometry_msgs/msg/Twist accepted on /cmd_vel_unstamped
  rate_hz: 'publisher-dependent: Nav2 chain 20 Hz (controller_frequency 20.0, smoothing_frequency 20.0); teleop_twist_joy
    event-driven per /joy message (joy_linux autorepeat_rate default 20 Hz while a button/axis is held, else on change); keyboard
    event-driven'
  qos: 'teleop_twist_joy: depth 10 (default reliable); nav2 collision_monitor: QoS(1); sim Create 3 motion_control subscribes
    SensorDataQoS (best effort) -> observer should subscribe best-effort/volatile to match any publisher'
  mapping:
  - condition: TwistStamped on /cmd_vel whose DDS publisher is a Nav2 node (collision_monitor, node name from `ros2 topic
      info -v`) and no human publisher active
    state: ai
    reason: null
    scope: base
    event_type: transition
    actor_id: ai:nav2
  - condition: TwistStamped on /cmd_vel from teleop_twist_joy_node (Bluetooth controller on the Pi, registered as local device)
    state: human_local
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:<operator_id>
  - condition: 'TwistStamped on /cmd_vel from teleop_twist_keyboard / ros2 topic pub on a remote PC (registry: remote)'
    state: human_remote
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:<operator_id>
  - condition: Twist/TwistStamped on /cmd_vel from an undeclared publisher (unknown node name / GID)
    state: human_remote
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:undeclared
  - condition: Nav2 and a human publisher both active on /cmd_vel within the same second (no arbitration exists)
    state: shared
    reason: human_initiated
    scope: base
    event_type: transition
    actor_id: human:<operator_id>
  uncovered_cases:
  - 'Two publishers interleave on the same topic with no mux: the Create 3 executes whichever message arrived last; the taxonomy
    has no rule for message-level contention -> propose `shared` for the overlap window plus flag `cmd_vel_contention`.'
  - 'Zero-velocity "disable" message sent once by teleop_twist_joy on enable-button release: is it human control? Propose:
    it ends the human episode (last human message), not a new one.'
  - Publisher identity is not stored by rosbag2 (only topic, recv/send timestamps); attribution must be captured live from
    DDS discovery (`ros2 topic info -v`) or by recording the upstream topics (/joy, /cmd_vel_nav, /cmd_vel_smoothed) alongside
    /cmd_vel.
  reliability: Best-effort/volatile subscription recommended; messages are not acknowledged by the firmware; the republisher
    relays them with no ordering guarantee between publishers.
  observe_passively: Subscribe to /cmd_vel with a GenericSubscription; capture publisher GID via rmw_message_info_t.publisher_gid
    in the callback and map GID->node name with `ros2 topic info -v /cmd_vel` / graph introspection at session start; also
    record /cmd_vel_nav and /cmd_vel_smoothed (Nav2-only) and /joy (controller-only) to attribute by topic.
  how_it_could_be_faked: Any machine on the same ROS_DOMAIN_ID can publish /cmd_vel under any node name (e.g. renamed to look
    like collision_monitor); a hidden participant on a different ROS_DOMAIN_ID or a discovery server the observer does not
    join is invisible; the Create 3 also accepts /cmd_vel directly in the _do_not_use namespace, bypassing the republished
    topic.
  tag: VERIFIED
  source_url:
  - https://github.com/turtlebot/turtlebot4_robot/blob/28e115f86930bb3273f1a1aa4738dbd8747513f0/turtlebot4_bringup/launch/robot.launch.py#L86
  - https://github.com/turtlebot/turtlebot4_robot/blob/28e115f86930bb3273f1a1aa4738dbd8747513f0/turtlebot4_bringup/launch/robot.launch.py#L87
  - https://github.com/turtlebot/turtlebot4_robot/blob/28e115f86930bb3273f1a1aa4738dbd8747513f0/turtlebot4_bringup/config/republisher.yaml#L33
  - https://github.com/turtlebot/turtlebot4_robot/blob/28e115f86930bb3273f1a1aa4738dbd8747513f0/turtlebot4_bringup/config/republisher.yaml#L34
  - https://github.com/turtlebot/turtlebot4/blob/7fd29fb420e906f3aca4a904adb54b69b11c7c00/turtlebot4_navigation/config/nav2.yaml#L299
  - https://github.com/turtlebot/turtlebot4/blob/7fd29fb420e906f3aca4a904adb54b69b11c7c00/turtlebot4_navigation/config/nav2.yaml#L300
  - https://github.com/ros2/teleop_twist_joy/blob/556a07100ee745f68619de84a95d3c84a4892ab9/src/teleop_twist_joy.cpp#L98
  - https://github.com/ros2/teleop_twist_keyboard/blob/ed06da483e4acef8d0ab225557d64e6597c9bdf2/teleop_twist_keyboard.py#L156
  - https://github.com/turtlebot/turtlebot4-user-manual/blob/4455a75dde3f052b5abf615dade22bece84120b0/tutorials/driving.md#L99
  - https://turtlebot.github.io/turtlebot4-user-manual/tutorials/driving.html
  version: turtlebot4_robot 2.0.1 (28e115f); turtlebot4 2.1.1 (7fd29fb); teleop_twist_joy 2.6.5; teleop_twist_keyboard 2.4.1
  track: stack
- id: T2
  name: Nav2 output before smoothing (AI-only velocity)
  layer: Nav2 as configured by turtlebot4_navigation
  source: nav2 controller_server and behavior_server (remapped cmd_vel -> cmd_vel_nav in nav2_bringup navigation_launch.py)
  interface: topic
  ros_name: /cmd_vel_nav
  message_type: 'geometry_msgs/msg/TwistStamped (enable_stamped_cmd_vel: true)'
  rate_hz: 20.0
  qos: nav2_util::TwistPublisher QoS depth 1
  mapping:
  - condition: Non-zero TwistStamped on /cmd_vel_nav
    state: ai
    reason: null
    scope: base
    event_type: transition
    actor_id: ai:nav2
  - condition: Zero TwistStamped on /cmd_vel_nav while a Nav2 goal is active (controller holding)
    state: ai
    reason: null
    scope: base
    event_type: heartbeat
    actor_id: ai:nav2
  uncovered_cases:
  - 'Behavior server recoveries (spin, backup, drive_on_heading) publish here too: taxonomy treats them as `ai` but they are
    scripted-like fixed motions; propose keep `ai` (they react to costmap) and tag x_behavior.'
  reliability: Only Nav2 publishes here; a human publishing on /cmd_vel_nav would be a spoof (see fakes).
  observe_passively: 'Subscribe and compare with /cmd_vel: human control is present when /cmd_vel carries messages not matching
    /cmd_vel_smoothed.'
  how_it_could_be_faked: A spoof node could publish /cmd_vel_nav to make human motion look like Nav2 output; the velocity_smoother
    would then relay it as cmd_vel_smoothed. Detect via publisher GID / node name of /cmd_vel_nav messages.
  tag: VERIFIED
