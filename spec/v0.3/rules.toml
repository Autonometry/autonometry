# Autonometry rule tables, v0.3. Machine-readable companion to definitions.md.
# definitions.md is normative: if this file disagrees with it, this file is the bug.

spec_version = "0.3"
# Genesis hash of every session chain: SHA-256("autonometry/chain-v1|<robot_id>|<session_id>")
chain_genesis_prefix = "autonometry/chain-v1"

# How each control state counts (definitions.md sections 2 and 4).
# category: ai | human | neutral | inactive | unmeasured
[states.ai]
category = "ai"
active = true

[states.human_local]
category = "human"
active = true

[states.human_remote]
category = "human"
active = true

[states.shared]
category = "human"  # conservative default; the shared_as_ai variant is a reported sensitivity
active = true

[states.scripted]
category = "neutral"
active = true

[states.safety_stop]
category = "neutral"
active = true

[states.idle]
category = "inactive"
active = false

[states.unknown]
category = "unmeasured"
active = false

# Whole-robot state from several scopes (definitions.md 6.6).
# First state in `precedence` held by any scope wins; `idle` needs every scope idle; else `fallback`.
[whole_robot]
precedence = ["human_remote", "human_local", "shared", "unknown", "safety_stop", "scripted", "ai"]
idle_requires_all_scopes = true
fallback = "unknown"

# Interventions (definitions.md 3, 6.1, 6.2, 6.7, 6.13).
[interventions]
from_states = ["ai", "scripted"]
into_states = ["human_local", "human_remote", "shared"]
# A scripted state ends an episode only when no person started it (definitions.md 3).
episode_ends_when_scope_returns_to = ["ai", "scripted"]  # or when the task or session ends
discrete_event_types = ["approval", "hint"]
# Entered from from_states, these are interventions when a person caused them: a safety_stop a
# person triggered (definitions.md 6.7), a scripted preset with reason human_initiated (6.13).
person_started_states = ["safety_stop", "scripted"]

# Holds (definitions.md 6.8) and the device registry (6.10).
[holds]
idle_in_open_task_becomes = "unknown"  # and is flagged idle_in_task

[device_location]
undeclared_device_state = "human_remote"  # and is flagged undeclared_device

# Reasons (definitions.md 3).
[reasons]
values = ["ai_requested_help", "human_initiated", "safety", "planned"]
required_for_states = ["human_local", "human_remote", "shared", "safety_stop"]
safety_stop_reason = "safety"

# Gaps (definitions.md 2, rule 2): silence longer than heartbeat_interval_s + gap_tolerance_s
# is unknown time for the part beyond the tolerance; any gap in seq makes the whole interval unknown.
[gaps]
rule = "heartbeat_plus_tolerance"

# Parameter defaults (definitions.md 9). Every value is printed in every report.
[params]
idle_threshold_s = 30.0
gap_tolerance_s = 2.0
heartbeat_interval_s = 1.0
help_latency_max_s = 120.0
approval_min_dwell_s = 0.0
approval_dwell_sensitivity_s = 5.0
approval_wait_max_s = 10.0
hint_ttl_s = 60.0
hint_min_dwell_s = 0.0
takeover_window_s = 60.0
simultaneity_window_s = 0.5
goal_release_s = 1.0
contention_window_s = 1.0
unknown_share_max = 0.05
react_s = 0.5  # definitions.md 12.3

# Loader flag codes (definitions.md 3, 5, 6.1, 6.8, 6.10, 6.12, 8).
[flags]
codes = [
  "time_gap", "seq_gap", "ts_regression", "missing_initial_state", "help_reason_recoded",
  "undeclared_scope", "nested_task", "task_end_without_start", "task_not_closed",
  "distance_regression", "no_session_start", "no_session_end", "idle_in_task",
  "ts_reconstructed", "undeclared_device", "repeated_session_marker",
  "event_outside_session", "clock_unsynced", "attribution_inferred", "registry_mismatch",
  "registry_missing", "unknown_task_definition", "unplanned", "approval_wait_recoded",
]

[errors]
codes = ["invalid_utf8", "invalid_unicode", "line_too_long", "invalid_json", "not_an_object", "duplicate_key", "non_finite_number", "integer_out_of_range", "schema_violation", "invalid_timestamp", "duplicate_seq"]
max_line_bytes = 65536
list_max_per_code = 100

# Trust levels (definitions.md 8, 6.12, 12; research/methods/trust.md section 7).
[trust]
reconstructed_events_max_level = 1
# Witnesses (definitions.md 12.6): (station-only + unwitnessed) / base and
# (disputed + unwitnessed) / base at most these for trust level L3.
l3_station_only_max_share = 0.005
l3_disputed_max_share = 0.02
# A clock error below this on a heartbeat whose clock_source is not ptp counts as
# l3_eps_substitute_s and is flagged (definitions.md 12.3), seconds.
l3_eps_min_without_ptp_s = 0.001
l3_eps_substitute_s = 0.05
# Why a robot session is not L3 (definitions.md 12.6), and the reconciler's flags (12.3).
l3_reasons = [
  "no_station", "robot_not_verified", "station_not_verified", "robot_clock_unsynced",
  "station_clock_unsynced", "invalid_station_state", "station_only_above_max",
  "disputed_above_max",
]
l3_flags = ["implausible_clock_error"]
# Robot states that count as robot human time, and the states a station scope may hold
# (definitions.md 12.1, 12.4): its idle state means no human, its unknown state lost input.
l3_robot_human_states = ["human_remote", "shared"]
l3_station_states = ["human_remote", "idle", "unknown"]

# Thresholds of the report's statements (definitions.md 11.6). Printed with the parameters.
[report]
rare_rate_events = 5
min_clusters = 2

# Sealing and verification (definitions.md section 10).
[sealing]
checkpoint_every_events = 1000
checkpoint_every_s = 600.0
max_commit_delay_s = 3600.0
clock_tolerance_s = 1.0
evidence_codes = [
  "hash_mismatch", "chain_break", "bad_signature", "root_mismatch", "missing_events",
  "bad_timestamp_token",
]
gap_codes = [
  "unsealed", "no_checkpoint", "untrusted_checkpoint", "not_anchored", "late_anchor",
  "clock_skew", "reconstructed",
]
file_codes = ["malformed_checkpoint", "orphan_timestamp"]
