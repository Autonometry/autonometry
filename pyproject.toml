[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonometry"
dynamic = ["version"]
description = "Measure how much of a robot's work is done by its AI and how much by humans, with a tamper-evident log."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aaryan Solanki" }]
keywords = ["robotics", "autonomy", "teleoperation", "audit-log", "metrics"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.26.0",
  "pydantic>=2.5.0",
  "jsonschema>=4.18.5",
  "rfc8785>=0.1.3",
  "cryptography>=49.0.0",
  "rfc3161-client>=1.0.9",
]

[project.optional-dependencies]
report = ["numpy>=1.26.0", "pandas>=2.1.1", "scipy>=1.11.2", "statsmodels>=0.14.1", "jinja2>=3.1.6", "matplotlib>=3.8.0"]
lerobot = ["pyarrow>=17.0.0", "watchfiles>=0.21.0"]

[project.urls]
Homepage = "https://github.com/autonometry/autonometry"
Repository = "https://github.com/autonometry/autonometry"
Issues = "https://github.com/autonometry/autonometry/issues"
Changelog = "https://github.com/autonometry/autonometry/blob/main/CHANGELOG.md"

[project.scripts]
autonometry = "autonometry.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.17", "mypy>=2.4", "pip-audit>=2.10",
  # jsonschema ships no type hints; mypy --strict needs these stubs.
  "types-jsonschema>=4.26",
]

[tool.hatch.version]
path = "src/autonometry/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/spec", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/autonometry"]

# The repo's spec/ folder is the single copy; the wheel carries it as autonometry/spec/.
[tool.hatch.build.targets.wheel.force-include]
"spec" = "autonometry/spec"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# research/ is reference-only design material: never linted, formatted, imported or shipped.
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT", "N", "C4", "PL"]

[tool.ruff.lint.per-file-ignores]
# pytest tests rely on bare assert (S101) and compare against literal expected values (PLR2004).
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["autonometry"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
# research/ is reference-only design material: never type-checked.
exclude = ["^research/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# research/ is reference-only design material: never collected, even by `pytest .`.
norecursedirs = ["research", ".*", "build", "dist", "*.egg", ".venv", "node_modules"]
addopts = "--strict-markers --strict-config --cov=autonometry --cov-report=term-missing --cov-fail-under=90 -m 'not slow'"
markers = ["slow: slow statistical validation, skipped by default (run with -m slow)"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["autonometry"]
