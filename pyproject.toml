[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonometry"
dynamic = ["version"]
description = "Measure how much of a robot's work is done by its AI and how much by humans, with a tamper-evident log."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aaryan Solanki" }]
keywords = ["robotics", "autonomy", "teleoperation", "audit-log", "metrics"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.26.0",
  "pydantic>=2.5.0",
  "jsonschema-rs>=0.29.1",
  "rfc8785>=0.1.3",
  "cryptography>=49.0.0",
  "rfc3161-client>=1.0.9",
]

[project.optional-dependencies]
report = ["numpy>=1.26.0", "pandas>=2.1.1", "scipy>=1.11.2", "statsmodels>=0.14.1", "jinja2>=3.1.6", "markupsafe>=2.1.5", "matplotlib>=3.10.7"]
lerobot = ["psutil>=6.0.0", "pyarrow>=17.0.0", "watchfiles>=0.21.0"]

[project.urls]
Homepage = "https://github.com/Autonometry/autonometry"
Repository = "https://github.com/Autonometry/autonometry"
Issues = "https://github.com/Autonometry/autonometry/issues"
Changelog = "https://github.com/Autonometry/autonometry/blob/main/CHANGELOG.md"

[project.scripts]
autonometry = "autonometry.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.17", "mypy>=2.4", "pip-audit>=2.10",
  # Reference validator for the differential test against jsonschema-rs (tests only).
  "jsonschema>=4.18.5",
]

[tool.hatch.version]
path = "src/autonometry/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/spec", "/tests", "/clients", "/connectors", "/demo", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/autonometry"]

# The repo's spec/ folder is the single copy; the wheel carries it as autonometry/spec/.
[tool.hatch.build.targets.wheel.force-include]
"spec" = "autonometry/spec"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# research/ is reference-only design material: never linted, formatted, imported or shipped.
extend-exclude = ["research"]
# The recorder client is copied into connectors on older systems: Python 3.8 syntax only.
per-file-target-version = { "clients/python/*.py" = "py38", "tests/client/*.py" = "py38", "connectors/ros2/autonometry_ros/autonometry_ros/autonometry_client.py" = "py38", "src/autonometry/connectors/autonometry_client.py" = "py38" }

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT", "N", "C4", "PL"]

[tool.ruff.lint.per-file-ignores]
# pytest tests rely on bare assert (S101) and compare against literal expected values (PLR2004).
"tests/**" = ["S101", "PLR2004"]
# The client's tests use unittest, so CI can run them on Python 3.8 without pytest.
"tests/client/**" = ["S101", "S108", "PLR2004", "PT009", "PT027", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["autonometry"]

[tool.mypy]
strict = true
python_version = "3.12"
# CI and most robots run Linux; this makes `if sys.platform != "win32":` guards (keys.py) check
# consistently regardless of the OS running mypy itself.
platform = "linux"
files = ["src"]
# research/ is reference-only design material: never type-checked.
exclude = ["^research/"]
plugins = ["pydantic.mypy"]

# SciPy, statsmodels, pyarrow and psutil ship no type information; numpy does.
[[tool.mypy.overrides]]
module = ["scipy.*", "statsmodels.*", "pyarrow.*", "psutil", "psutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Shared helpers (sealing_helpers, recorder_helpers) live in tests/ and are imported by name.
pythonpath = ["tests"]
# research/ is reference-only design material: never collected, even by `pytest .`.
norecursedirs = ["research", ".*", "build", "dist", "*.egg", ".venv", "node_modules"]
addopts = "--strict-markers --strict-config --cov=autonometry --cov-report=term-missing --cov-fail-under=90 -m 'not slow and not network'"
markers = [
  "slow: slow statistical validation, skipped by default (run with -m slow)",
  "network: downloads public data from the internet, skipped by default (run with -m network)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["autonometry"]
