# Parameters of the Autonometry station observer (README, "Station witness"). It runs on the
# operator's PC beside a recorder with role = "station". Topic and node names are relative to the
# robot namespace unless they start with "/". goal_release_s and gap_tolerance_s come from the
# spec's rules.toml, never from here.
/**:
  ros__parameters:
    recorder_socket: /run/autonometry/station.sock
    client_name: station_observer
    device_registry: /etc/autonometry/station-devices.json   # the station's own inputs only
    spec_version: "0.3"
    scopes: [base]                       # must be the station recorder's scopes
    joy_node: joy_node                   # publishes /joy from this PC's joystick
    dead_zone: 0.05                      # sticks within this of centre are neutral
    deadman_buttons: [4, 5]
    unidentified_actor_id: person:unidentified
    tick_period_s: 0.25                  # state re-sent at least this often (recorder: 1 s)
    topics:
      cmd_vel: cmd_vel
      cmd_vel_unstamped: cmd_vel_unstamped
      cmd_vel_smoothed: cmd_vel_smoothed
      joy: joy
